name: Reusable image publisher
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      version:
        type: string
        required: true
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      smoke-command:
        type: string
        required: true
    outputs:
      digest:
        description: Combined manifest digest of the tested images
        value: ${{ jobs.publish.outputs.digest }}
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.promote.outputs.digest }}
    env:
      IMAGE_BASE: ${{ inputs.image }}
      VERSION: ${{ inputs.version }}
      CONTEXT: ${{ inputs.context }}
      DOCKERFILE: ${{ inputs.dockerfile }}
      PLATFORMS: ${{ inputs.platforms }}
      SMOKE_COMMAND: ${{ inputs.smoke-command }}
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE: https://github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate inputs and resolve source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'ghcr\.io/[a-z0-9][a-z0-9._/-]*[a-z0-9]', os.environ['IMAGE_BASE']), 'Expected a lowercase GHCR image path'
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', os.environ['VERSION']), 'Expected a canonical stable version'
          platforms = os.environ['PLATFORMS'].split(',')
          assert platforms and len(platforms) == len(set(platforms)) and all(p in ('linux/amd64', 'linux/arm64') for p in platforms), 'Unsupported or duplicate platform'
          PY
          echo "REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and smoke every platform before registry access
        id: build-smoke
        run: |
          set -euo pipefail
          IFS=',' read -r -a platforms <<< "$PLATFORMS"
          for PLATFORM in "${platforms[@]}"; do
            arch="${PLATFORM#linux/}"
            IMAGE="wishlist-tested:${RUN_KEY}-${arch}"
            export IMAGE PLATFORM
            docker buildx build --platform "$PLATFORM" --load \
              --file "$DOCKERFILE" --tag "$IMAGE" \
              --build-arg "VCS_REF=$REVISION" --build-arg "VERSION=$VERSION" \
              --label "org.opencontainers.image.source=$SOURCE" \
              --label "org.opencontainers.image.revision=$REVISION" \
              --label "org.opencontainers.image.version=$VERSION" "$CONTEXT"
            bash -euo pipefail -c "$SMOKE_COMMAND"
          done
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse existing stable version (fail closed on registry errors)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          path = os.environ['IMAGE_BASE'].removeprefix('ghcr.io/')
          query = urllib.parse.urlencode({'service': 'ghcr.io', 'scope': f'repository:{path}:pull'})
          credentials = base64.b64encode(f"{os.environ['GH_ACTOR']}:{os.environ['GH_TOKEN']}".encode()).decode()
          request = urllib.request.Request('https://ghcr.io/token?' + query, headers={'Authorization': 'Basic ' + credentials})
          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)['token']
          request = urllib.request.Request(f"https://ghcr.io/v2/{path}/manifests/{os.environ['VERSION']}", headers={
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json'})
          try:
              with urllib.request.urlopen(request, timeout=30):
                  pass
          except urllib.error.HTTPError as error:
              body = json.load(error)
              if error.code != 404 or not body.get('errors') or any(e.get('code') != 'MANIFEST_UNKNOWN' for e in body['errors']):
                  raise RuntimeError('Registry absence check failed; not safe to publish') from None
          else:
              raise SystemExit('Exact version already exists. Do not republish: rerun only failed asset attachment, or explicitly inspect/repair a partial publication.')
          PY
      - name: Push tested images and promote their exact digests
        id: promote
        run: |
          set -euo pipefail
          IFS=',' read -r -a platforms <<< "$PLATFORMS"
          references=()
          for platform in "${platforms[@]}"; do
            arch="${platform#linux/}"
            staging="$IMAGE_BASE:staging-${RUN_KEY}-${arch}"
            docker tag "wishlist-tested:${RUN_KEY}-${arch}" "$staging"
            docker push "$staging"
            digest=$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            references+=("$IMAGE_BASE@$digest")
          done
          # Tag writes are not atomic. On failure inspect all three tags before repair.
          docker buildx imagetools create --tag "$IMAGE_BASE:$VERSION" \
            --tag "$IMAGE_BASE:sha-$REVISION" --tag "$IMAGE_BASE:latest" "${references[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE_BASE:$VERSION" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          for tag in "sha-$REVISION" latest; do
            actual=$(docker buildx imagetools inspect "$IMAGE_BASE:$tag" --format '{{.Manifest.Digest}}')
            [[ "$actual" == "$digest" ]]
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published $IMAGE_BASE:$VERSION@$digest" >> "$GITHUB_STEP_SUMMARY"
